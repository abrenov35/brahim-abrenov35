<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AB RENOV — Suivi Chantiers</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>

:root{
  --navy:#123F70;
  --navy-dark:#0A315B;
  --blue:#1976D2;
  --green:#2E8B57;
  --green-bright:#00B94F;
  --green-soft:#D9F0D9;
  --red:#D92D2D;
  --red-soft:#F8C8CE;
  --orange:#F28C00;
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --surface-soft:#F7F9FC;
  --text:#0D2D4F;
  --muted:#6F8196;
  --border:#D8E0EA;
  --font:'Raleway',sans-serif;
  --mono:'DM Mono',monospace;
  --hh:76px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}

.header{
  height:var(--hh);
  background:var(--navy);
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.header-inner{
  width:100%;
  max-width:1180px;
  height:100%;
  margin:0 auto;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{
  width:32px;
  height:32px;
  border-radius:6px;
  background:#0C5BA7;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  border:1px solid rgba(255,255,255,.22);
}
.brand-name{
  font-size:15px;
  font-weight:900;
  letter-spacing:.2px;
  color:#fff;
}
.brand-sub{
  font-size:8px;
  color:#AFC6DD;
  letter-spacing:.7px;
  text-transform:uppercase;
  font-weight:700;
  margin-top:2px;
}
.btn-refresh{
  width:34px;
  height:34px;
  border-radius:7px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:15px;
  cursor:pointer;
}

.stats-band{
  width:100%;
  background:#F9FAFC;
  padding:8px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border-bottom:1px solid #C7D3E1;
}
.stat-pill{
  width:240px;
  height:42px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border-radius:7px;
  background:#fff;
  border:1px solid var(--border);
  box-shadow:0 1px 4px rgba(13,45,79,.08);
}
.stat-pill:nth-child(1){border-left:4px solid #7A4FD3}
.stat-pill:nth-child(2){border-left:4px solid var(--green)}
.stat-pill:nth-child(3){border-left:4px solid var(--blue)}
.stat-icon{
  width:24px;
  height:24px;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
}
.stat-icon.prev{background:#ECE4FF;color:#6E49C4}
.stat-icon.fact{background:#DFF4E8;color:#238552}
.stat-icon.month{background:#E0EEFF;color:#226DC3}
.stat-pill-label{
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.45px;
  color:#51677F;
  white-space:nowrap;
}
.stat-pill-sep{display:none}
.stat-pill-value{
  margin-left:auto;
  font-size:14px;
  font-weight:900;
  color:var(--navy-dark);
  white-space:nowrap;
}

.tabs{
  width:100%;
  background:var(--navy);
  padding:0 20px 10px;
  display:flex;
  justify-content:center;
  gap:8px;
  position:sticky;
  top:var(--hh);
  z-index:90;
}
.tab{
  width:190px;
  height:34px;
  border-radius:6px;
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#fff;
  font-family:var(--font);
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 1px 3px rgba(0,0,0,.14);
}
.tab[data-tab="previsionnel"]{background:#1877C9}
.tab[data-tab="facture"]{background:#357F42}
.tab[data-tab="stats"]{background:#00A844}
.tab:hover{filter:brightness(1.05)}
.tab.active{outline:2px solid rgba(255,255,255,.3)}
.tab-dot{width:7px;height:7px;border-radius:50%;background:#fff}
.tab-count{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.18);
  color:#fff;
  font-family:var(--mono);
  font-size:9px;
  border:1px solid rgba(255,255,255,.22);
}

.main-wrap{
  width:100%;
  max-width:1180px;
  margin:10px auto 0;
  padding:0 18px 28px;
}
.tab-pane{display:none}
.tab-pane.active{display:block}
.section-header{
  background:#fff;
  border:1px solid var(--border);
  border-top:3px solid #1769AA;
  border-radius:10px 10px 0 0;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.section-title{
  font-size:14px;
  font-weight:900;
  color:#0D2D4F;
  letter-spacing:.1px;
}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-row select,#stats-annee{
  height:32px;
  padding:0 10px;
  border:1px solid #BFCBDD;
  border-radius:6px;
  background:#fff;
  color:var(--text);
  font-family:var(--font);
  font-size:10px;
  font-weight:700;
}
.info-msg{
  margin:0;
  padding:10px 14px;
  background:#EEF6FF;
  border-left:3px solid #1976D2;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  font-size:10px;
  color:#45627F;
  font-weight:700;
}
.btn-add{
  height:32px;
  padding:0 14px;
  border-radius:6px;
  border:1px solid #2D7E4D;
  background:#2E8B57;
  color:#fff;
  font-family:var(--font);
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.card-list,#stats-content{
  padding:12px;
  background:#fff;
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  border-radius:0 0 10px 10px;
}
.card{
  position:relative;
  width:100%;
  background:#fff;
  border:1px solid #DCE4ED;
  border-radius:7px;
  padding:10px 12px 10px 14px;
  margin-bottom:8px;
  box-shadow:0 1px 3px rgba(13,45,79,.05);
}
.card::before{
  content:'';
  position:absolute;
  left:-1px;
  top:-1px;
  bottom:-1px;
  width:3px;
  border-radius:7px 0 0 7px;
}
.card.prev::before{background:#7A4FD3}
.card.fact::before{background:#2E8B57}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-left{flex:1;min-width:0}
.card-client{
  font-size:12px;
  font-weight:900;
  color:#0A2744;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:20px;
  padding:2px 7px;
  border-radius:5px;
  font-size:8.5px;
  font-weight:800;
  background:#F5F7FA;
  color:#64778D;
  border:1px solid #DDE5EE;
}
.tag.t-fact{background:#E4F4E8;color:#247846;border-color:#BFDCC8}
.tag.t-date{background:#EFF4FA;color:#47627E}
.card-right{display:flex;align-items:center;gap:8px}
.card-amount{font-size:14px;font-weight:900;color:#0D2D4F}
.card-amount.green{color:#188749}
.card-amount.grey{font-size:10px;color:#98A6B6;font-style:italic}
.card-actions{display:flex;gap:5px}
.btn-edit,.btn-del{
  width:28px;
  height:28px;
  border-radius:6px;
  border:1px solid #1877D3;
  background:#fff;
  color:#1877D3;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn-del{border-color:#D1D9E3;color:#7C8C9D}
.btn-edit:hover{background:#EAF4FF}
.btn-del:hover{background:#FFF1F1;color:#C83939;border-color:#E5B8B8}

.empty{text-align:center;padding:42px 18px;color:#9AA7B7}
.empty p{font-size:10px;font-weight:700}
.loading{text-align:center;padding:34px;color:#7F8EA1;font-size:10px;font-weight:800}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-big{
  background:#F7F9FC;
  border:1px solid #DCE4ED;
  border-radius:7px;
  padding:12px;
}
.stat-big-label{font-size:8px;font-weight:900;text-transform:uppercase;color:#64778D;margin-bottom:5px}
.stat-big-value{font-size:18px;font-weight:900;color:#0D2D4F}
.stat-big-value.v{color:#6E49C4}
.stat-big-value.g{color:#188749}
.stitle{
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  color:#0D2D4F;
  margin:18px 0 10px;
  padding-bottom:7px;
  border-bottom:1px dashed #CBD5E1;
}
.month-row,.year-row{
  background:#fff;
  border:1px solid #DCE4ED;
  border-radius:6px;
  margin-bottom:6px;
}
.month-row{display:flex;align-items:center;gap:10px;padding:9px 11px}
.month-name{min-width:72px;font-size:10px;font-weight:900;color:#0D2D4F}
.month-bar-wrap{flex:1;height:5px;background:#E9EEF4;border-radius:999px;overflow:hidden}
.month-bar{height:100%;background:#2E8B57}
.month-count{font-size:9px;color:#708297}
.month-amount{min-width:88px;text-align:right;font-size:12px;font-weight:900;color:#188749}
.year-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px}
.year-label{font-size:15px;font-weight:900}
.year-count{font-size:9px;color:#708297}
.year-amount{font-size:13px;font-weight:900;color:#6E49C4}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(9,32,58,.48);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-box{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:10px;
  border:1px solid #C9D4E1;
  max-height:90vh;
  overflow-y:auto;
}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #E1E7EF}
.modal-header h3{font-size:13px;font-weight:900;color:#0D2D4F}
.modal-close{
  width:28px;
  height:28px;
  border:1px solid #BFCBDD;
  background:#fff;
  color:#52708F;
  border-radius:6px;
  cursor:pointer;
}
.modal-body{padding:18px}
.field-group{margin-bottom:13px}
.field-group label{display:block;font-size:9px;font-weight:900;text-transform:uppercase;color:#60758D;margin-bottom:5px}
.field-group input{
  width:100%;
  height:38px;
  padding:0 11px;
  border:1px solid #C9D4E1;
  border-radius:6px;
  font-family:var(--font);
  color:#0D2D4F;
}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.btn-cancel,.btn-save{
  flex:1;
  height:38px;
  border-radius:6px;
  font-family:var(--font);
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}
.btn-cancel{background:#F1F4F8;border:1px solid #D2DBE6;color:#60758D}
.btn-save{background:#2E8B57;border:1px solid #287B4D;color:#fff}
.status-bar{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
  z-index:300;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.status-bar.success{background:#2E8B57;color:#fff}
.status-bar.error{background:#D92D2D;color:#fff}
.status-bar.info{background:#123F70;color:#fff}

@media(max-width:760px){
  .header-inner{padding:0 12px}
  .stats-band{justify-content:flex-start;overflow-x:auto;padding:8px 10px}
  .stat-pill{min-width:210px}
  .tabs{justify-content:flex-start;overflow-x:auto;padding:0 10px 8px}
  .tab{min-width:155px}
  .main-wrap{padding:0 10px 20px}
  .section-header{padding:12px}
  .card-list,#stats-content{padding:9px}
  .stats-grid{grid-template-columns:1fr}
  .month-count{display:none}
}

</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">AB</div>
      <div>
        <div class="brand-name">AB RENOV</div>
        <div class="brand-sub">Aménagement &amp; Rénovation</div>
      </div>
    </div>
    <button class="btn-refresh" onclick="loadData()">↻</button>
  </div>
</header>

<div class="stats-band">
  <div class="stat-pill">
    <span class="stat-icon prev">▤</span>
    <span class="stat-pill-label">Prévisionnel</span>
    <span class="stat-pill-sep">·</span>
    <span class="stat-pill-value" id="stat-prev">—</span>
  </div>
  <div class="stat-pill">
    <span class="stat-icon fact">▧</span>
    <span class="stat-pill-label">Facturé <span id="stat-annee-label">2026</span></span>
    <span class="stat-pill-sep">·</span>
    <span class="stat-pill-value" id="stat-annee">—</span>
  </div>
  <div class="stat-pill">
    <span class="stat-icon month">▥</span>
    <span class="stat-pill-label">Ce mois</span>
    <span class="stat-pill-sep">·</span>
    <span class="stat-pill-value" id="stat-mois">—</span>
  </div>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="previsionnel" onclick="switchTab('previsionnel')"><span class="tab-dot dot-v"></span>Prévisionnels<span class="tab-count" id="count-prev">0</span></button>
  <button class="tab" data-tab="facture" onclick="switchTab('facture')"><span class="tab-dot dot-g"></span>Facturés<span class="tab-count" id="count-fact">0</span></button>
  <button class="tab" data-tab="stats" onclick="switchTab('stats')">Stats</button>
</nav>

<div class="main-wrap">
  <div id="tab-previsionnel" class="tab-pane active">
    <div class="section-header">
      <div class="section-title">Chantiers prévisionnels</div>
      <button class="btn-add" onclick="openModal('add')">+ Ajouter</button>
    </div>
    <div class="info-msg">Saisir un numéro de facture fait basculer le chantier en Facturés automatiquement.</div>
    <div id="list-previsionnel" class="card-list"><div class="loading">Chargement…</div></div>
  </div>

  <div id="tab-facture" class="tab-pane">
    <div class="section-header">
      <div class="section-title">Chantiers facturés</div>
      <div class="filter-row">
        <select id="filter-annee" onchange="renderFactures()"><option value="">Toutes années</option></select>
        <select id="filter-mois" onchange="renderFactures()"><option value="">Tous mois</option><option value="1">Janvier</option><option value="2">Février</option><option value="3">Mars</option><option value="4">Avril</option><option value="5">Mai</option><option value="6">Juin</option><option value="7">Juillet</option><option value="8">Août</option><option value="9">Septembre</option><option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option></select>
      </div>
    </div>
    <div id="list-facture" class="card-list"><div class="loading">Chargement…</div></div>
  </div>

  <div id="tab-stats" class="tab-pane">
    <div class="section-header">
      <div class="section-title">Statistiques</div>
      <select id="stats-annee" onchange="renderStats()"><option value="">Toutes années</option></select>
    </div>
    <div id="stats-content"><div class="loading">Chargement…</div></div>
  </div>
</div>

<div id="status-bar" class="status-bar hidden"></div>

<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Nouveau chantier</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="field-id"/>
      <div class="field-group"><label>Client / Référence *</label><input type="text" id="field-client" placeholder="Ex : M. Dupont — Cuisine"/></div>
      <div class="field-group"><label>Montant (€)</label><input type="number" id="field-montant" placeholder="Ex : 2450" min="0" step="0.01"/></div>
      <div class="field-group"><label>Information libre</label><input type="text" id="field-info" placeholder="Ex : Semaine 42"/></div>
      <div class="field-group"><label>Numéro de facture <span class="field-hint">(vide = prévisionnel)</span></label><input type="text" id="field-facture" placeholder="Ex : FAC-2026-018"/></div>
      <div class="field-group"><label>Date</label><input type="date" id="field-date"/></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save" onclick="saveChantier()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyuFLgzcyv8Hj7eWJN5RJc90KsothvsN9Mo8rX5Pt74n8l0br4aO_9R6EUyDq5pH6eYZg/exec';
let allData=[];

window.addEventListener('DOMContentLoaded',()=>loadData());

async function loadData(){
  showStatus('Chargement…','info');
  try{
    const res=await fetch(API_URL+'?action=getAll',{redirect:'follow'});
    const txt=await res.text();
    const json=JSON.parse(txt);
    if(json.status!=='ok')throw new Error(json.message);
    allData=json.data||[];
    renderAll();
    hideStatus();
  }catch(err){
    console.error(err);
    showStatus('Erreur de chargement','error',5000);
    allData=[];
    renderAll();
  }
}

function renderAll(){
  updateFilters();
  renderPrevisionnels();
  renderFactures();
  renderStats();
  renderBand();
}

function renderPrevisionnels(){
  let list=allData.filter(c=>c.statut==='previsionnel');

  list.sort((a,b)=>{
    const da=new Date(a.date_creation||0);
    const db=new Date(b.date_creation||0);
    return db-da;
  });

  document.getElementById('count-prev').textContent=list.length;
  const el=document.getElementById('list-previsionnel');

  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">—</div><p>Aucun chantier prévisionnel</p></div>';
    return;
  }

  el.innerHTML=list.map(c=>{
    const z=Number(c.montant||0)===0;
    return`
      <div class="card prev">
        <div class="card-row">
          <div class="card-left">
            <div class="card-client">${esc(c.client)}</div>
            <div class="card-meta">
              <span class="tag t-date">${fmtDate(c.date_creation)}</span>
              ${c.information?`<span class="tag">${esc(c.information)}</span>`:''}
            </div>
          </div>
          <div class="card-right">
            <div class="card-amount${z?' grey':''}">${z?'À définir':fmt(c.montant)}</div>
            <div class="card-actions">
              <button class="btn-edit" onclick="openModal('edit','${c.id}')">✎</button>
              <button class="btn-del" onclick="del('${c.id}')">×</button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderFactures(){
  let list=allData.filter(c=>c.statut==='facture');
  const a=document.getElementById('filter-annee').value;
  const m=document.getElementById('filter-mois').value;

  if(a)list=list.filter(c=>String(c.annee)===a);
  if(m)list=list.filter(c=>String(c.mois)===m);

  list.sort((x,y)=>{
    if(Number(y.annee)!==Number(x.annee)) return Number(y.annee)-Number(x.annee);
    if(Number(y.mois)!==Number(x.mois)) return Number(y.mois)-Number(x.mois);
    return new Date(y.date_creation)-new Date(x.date_creation);
  });

  document.getElementById('count-fact').textContent=allData.filter(c=>c.statut==='facture').length;
  const el=document.getElementById('list-facture');

  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">—</div><p>Aucun chantier facturé</p></div>';
    return;
  }

  let html='';
  let current='';

  list.forEach(c=>{
    const grp=`${nomMois(c.mois).toUpperCase()} ${c.annee}`;
    if(grp!==current){
      current=grp;
      html+=`<div style="margin:20px 0 10px;font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--navy);border-bottom:2px solid rgba(22,45,73,.12);padding-bottom:6px;">${grp}</div>`;
    }

    html+=`
    <div class="card fact">
      <div class="card-row">
        <div class="card-left">
          <div class="card-client">${esc(c.client)}</div>
          <div class="card-meta">
            <span class="tag t-fact">${esc(c.facture)}</span>
            <span class="tag t-date">${fmtDate(c.date_creation)}</span>
            ${c.information?`<span class="tag">${esc(c.information)}</span>`:''}
          </div>
        </div>
        <div class="card-right">
          <div class="card-amount green">${fmt(c.montant)}</div>
          <div class="card-actions">
            <button class="btn-edit" onclick="openModal('edit','${c.id}')">✎</button>
            <button class="btn-del" onclick="del('${c.id}')">×</button>
          </div>
        </div>
      </div>
    </div>`;
  });

  el.innerHTML=html;
}

function renderStats(){
  const annee=document.getElementById('stats-annee').value?Number(document.getElementById('stats-annee').value):null;
  let fac=allData.filter(c=>c.statut==='facture');
  if(annee)fac=fac.filter(c=>Number(c.annee)===annee);

  const totFac=fac.reduce((s,c)=>s+Number(c.montant||0),0);
  const totPrev=allData.filter(c=>c.statut==='previsionnel').reduce((s,c)=>s+Number(c.montant||0),0);

  const parMois={};
  for(let m=1;m<=12;m++)parMois[m]={total:0,count:0};

  fac.forEach(c=>{
    const m=Number(c.mois);
    if(m>=1&&m<=12){
      parMois[m].total+=Number(c.montant||0);
      parMois[m].count++;
    }
  });

  const maxM=Math.max(...Object.values(parMois).map(v=>v.total),1);
  const annees={};

  allData.filter(c=>c.statut==='facture').forEach(c=>{
    const a=c.annee||'—';
    if(!annees[a])annees[a]={total:0,count:0};
    annees[a].total+=Number(c.montant||0);
    annees[a].count++;
  });

  document.getElementById('stats-content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-big"><div class="stat-big-label">Prévisionnel en cours</div><div class="stat-big-value v">${fmt(totPrev)}</div></div>
      <div class="stat-big"><div class="stat-big-label">Facturé ${annee||'global'}</div><div class="stat-big-value g">${fmt(totFac)}</div></div>
      <div class="stat-big"><div class="stat-big-label">Chantiers facturés</div><div class="stat-big-value">${fac.length}</div></div>
    </div>
    <div class="stitle">Par mois ${annee||''}</div>
    ${Object.entries(parMois).map(([m,d])=>{
      const pct=Math.round((d.total/maxM)*100);
      return`
        <div class="month-row">
          <div class="month-name">${nomMois(m)}</div>
          <div class="month-bar-wrap"><div class="month-bar" style="width:${pct}%"></div></div>
          <div class="month-count">${d.count} chantier${d.count>1?'s':''}</div>
          <div class="month-amount">${d.total>0?fmt(d.total):'—'}</div>
        </div>`;
    }).join('')}
    <div class="stitle" style="margin-top:32px">Par année</div>
    ${Object.entries(annees).sort((a,b)=>b[0]-a[0]).map(([a,d])=>`
      <div class="year-row">
        <div class="year-label">${a}</div>
        <div class="year-count">${d.count} chantier${d.count>1?'s':''}</div>
        <div class="year-amount">${fmt(d.total)}</div>
      </div>`).join('')||'<div class="empty"><p>Aucune donnée</p></div>'}`;
}

function renderBand(){
  const now=new Date(),a=now.getFullYear(),m=now.getMonth()+1;
  const totPrev=allData.filter(c=>c.statut==='previsionnel').reduce((s,c)=>s+Number(c.montant||0),0);
  const totAnnee=allData.filter(c=>c.statut==='facture'&&Number(c.annee)===a).reduce((s,c)=>s+Number(c.montant||0),0);
  const totMois=allData.filter(c=>c.statut==='facture'&&Number(c.annee)===a&&Number(c.mois)===m).reduce((s,c)=>s+Number(c.montant||0),0);

  document.getElementById('stat-prev').textContent=fmt(totPrev);
  document.getElementById('stat-annee').textContent=fmt(totAnnee);
  document.getElementById('stat-annee-label').textContent=a;
  document.getElementById('stat-mois').textContent=fmt(totMois);
}

function updateFilters(){
  const annees=[...new Set(allData.filter(c=>c.annee).map(c=>String(c.annee)))].sort((a,b)=>b-a);
  ['filter-annee','stats-annee'].forEach(id=>{
    const sel=document.getElementById(id);
    const val=sel.value;
    sel.innerHTML='<option value="">Toutes années</option>'+annees.map(a=>`<option value="${a}">${a}</option>`).join('');
    sel.value=val;
  });
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-pane').forEach(e=>e.classList.toggle('active',e.id===`tab-${tab}`));
}

function openModal(mode,id){
  document.getElementById('modal-overlay').classList.remove('hidden');
  if(mode==='add'){
    document.getElementById('modal-title').textContent='Nouveau chantier';
    ['field-id','field-client','field-montant','field-info','field-facture','field-date'].forEach(f=>document.getElementById(f).value='');
  }else{
    const c=allData.find(x=>x.id===id);
    if(!c)return;
    document.getElementById('modal-title').textContent='Modifier le chantier';
    document.getElementById('field-id').value=c.id;
    document.getElementById('field-client').value=c.client||'';
    document.getElementById('field-montant').value=c.montant||'';
    document.getElementById('field-info').value=c.information||'';
    document.getElementById('field-facture').value=c.facture||'';
    document.getElementById('field-date').value=c.date_creation?String(c.date_creation).split('T')[0]:'';
  }
}

function closeModal(evt){
  if(evt&&evt.target!==document.getElementById('modal-overlay'))return;
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function saveChantier(){
  const id=document.getElementById('field-id').value.trim();
  const client=document.getElementById('field-client').value.trim();
  const montant=document.getElementById('field-montant').value.trim();

  if(!client){
    alert('Le nom du client est obligatoire.');
    return;
  }

  const payload={
    action:id?'update':'add',
    client,
    montant:montant?Number(montant):0,
    information:document.getElementById('field-info').value.trim(),
    facture:document.getElementById('field-facture').value.trim(),
    date_creation:document.getElementById('field-date').value||new Date().toISOString().split('T')[0]
  };

  if(id)payload.id=id;

  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify(payload),redirect:'follow'});
    const json=JSON.parse(await res.text());
    if(json.status!=='ok')throw new Error(json.message);
    closeModal();
    showStatus('Chantier enregistré','success',3000);
    await loadData();
  }catch(err){
    console.error(err);
    showStatus('Erreur enregistrement','error',4000);
  }
}

async function del(id){
  const c=allData.find(x=>x.id===id);
  if(!c||!confirm(`Supprimer "${c.client}" ?`))return;

  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'delete',id}),redirect:'follow'});
    const json=JSON.parse(await res.text());
    if(json.status!=='ok')throw new Error(json.message);
    showStatus('Chantier supprimé','success',3000);
    await loadData();
  }catch(err){
    showStatus('Erreur suppression','error',4000);
  }
}

function fmt(val){
  const n=Number(val);
  if(isNaN(n)||val===''||val===null||val===undefined)return'—';
  return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
}

function fmtDate(val){
  if(!val)return'—';
  const d=new Date(val);
  if(isNaN(d))return val;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function nomMois(n){
  return['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'][Number(n)]||'—';
}

function esc(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let stTimer=null;

function showStatus(msg,type='info',duration=0){
  const bar=document.getElementById('status-bar');
  bar.textContent=msg;
  bar.className=`status-bar ${type}`;
  bar.classList.remove('hidden');
  if(stTimer)clearTimeout(stTimer);
  if(duration>0)stTimer=setTimeout(hideStatus,duration);
}

function hideStatus(){
  document.getElementById('status-bar').classList.add('hidden');
}
</script>
